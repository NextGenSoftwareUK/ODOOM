name: Release ODOOM

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable semantic version (X.Y.Z)
        required: true
        type: string
      release_notes:
        description: Reviewed Markdown release notes
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release identity
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          ! gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1

  build-windows:
    needs: validate
    uses: ./.github/workflows/build_core.yml
    secrets: inherit
    with:
      name: ODOOM-Windows-x64
      os: windows-latest
      build_type: Release
      deps_cmdline: choco install tree
      extra_options: -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DOASIS_STAR_API=ON -DOGENGINE_DIR=${{ github.workspace }}/src -DOGENGINE_LIB_DIR=${{ github.workspace }}/src

  publish:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: ODOOM-Windows-x64 Release
          path: artifacts
      - name: Verify integrated package
        run: |
          set -euo pipefail
          archive=$(find artifacts -type f -name '*.zip' -print -quit)
          test -n "$archive"
          unzip -l "$archive" | grep -q 'star_api.dll'
          unzip -l "$archive" | grep -q 'uzdoom.exe'
      - name: Create ODOOM release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          mapfile -t assets < <(find artifacts -type f -name '*.zip')
          gh release create "v$VERSION" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ODOOM v$VERSION" --notes-file release-notes.md --verify-tag=false
